[workspace.package]
authors = ["o2sh <ossama-hjaji@live.fr>"]
edition = "2024"
license = "MIT"
version = "2.28.1"
repository = "https://github.com/o2sh/onefetch"

[workspace]
members = ["ascii", "image", "manifest"]

[package]
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
description = "Command-line Git information tool"
exclude = ["site/*"]
keywords = ["git", "cli", "terminal"]
name = "onefetch"
homepage = "https://onefetch.dev"
rust-version = "1.88.0"

[package.metadata.deb]
maintainer = "Ossama Hjaji <ossama-hjaji@live.fr>"
copyright = "2018, Ossama Hjaji <ossama-hjaji@live.fr>"
license-file = ["LICENSE.md", "4"]
extended-description = """\
A command-line Git information tool that displays project information \
and code statistics for a local Git repository directly in your terminal."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    [
        "target/release/onefetch",
        "usr/bin/",
        "755",
    ],
    [
        "docs/onefetch.1",
        "usr/share/man/man1/onefetch.1",
        "644",
    ],
]

[dependencies]
anyhow = "1.0.104"
askalono = "0.5.0"
byte-unit = "5.2.5"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
gix = { version = "0.87.1", default-features = false, features = [
    "max-performance-safe",
    "blob-diff",
    "mailmap",
    "index",
    "status",
    "sha1",
] }
globset = "0.4.20"
human-panic = "2.0.8"
image = { version = "0.25.10", default-features = false }
num-format = "0.4.4"
onefetch-ascii = { path = "ascii", version = "2.28.1" }
onefetch-image = { path = "image", version = "2.28.1" }
onefetch-manifest = { path = "manifest", version = "2.28.1" }
owo-colors = "4.4.0"
regex = "1.13.1"
serde = "1.0.228"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.55", features = ["formatting"] }
time-humanize = { version = "0.1.3", features = ["time"] }
tokei = "14.0.0"
typetag = "0.2.23"

[dev-dependencies]
criterion = "0.8.2"
gix-testtools = "0.20.0"
insta = { version = "1.48.0", features = ["json", "redactions"] }
rstest = "0.26.1"

[[bench]]
name = "repo"
harness = false

[build-dependencies]
lazy_static = "1.5.0"
regex = "1.13.1"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tera = { version = "2.3.0", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"

[features]
fail-on-deprecated = []

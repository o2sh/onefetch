[package]
authors = ["o2sh <hjajiossama@gmail.com>"]
edition = "2024"
license = "MIT"
version = "3.0.0"
repository = "https://github.com/o2sh/onefetch"
categories = ["command-line-utilities"]
description = "Command-line Git information tool"
exclude = ["site/*"]
keywords = ["git", "cli", "terminal"]
name = "onefetch"
homepage = "https://onefetch.dev"
rust-version = "1.88.0"

[package.metadata.deb]
maintainer = "Ossama Hjaji <hjajiossama@gmail.com>"
copyright = "2018, Ossama Hjaji <hjajiossama@gmail.com>"
license-file = ["LICENSE.md", "4"]
extended-description = """\
A command-line Git information tool that displays project information \
and code statistics for a local Git repository directly in your terminal."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    [
        "target/release/onefetch",
        "usr/bin/",
        "755",
    ],
    [
        "docs/onefetch.1",
        "usr/share/man/man1/onefetch.1",
        "644",
    ],
]

[dependencies]
anyhow = "1.0.104"
askalono = "0.5.0"
byte-unit = "5.2.6"
cargo_toml = "1.0.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
gix = { version = "0.88.0", default-features = false, features = [
    "max-performance-safe",
    "blob-diff",
    "mailmap",
    "index",
    "status",
    "sha1",
    "anyhow",
] }
globset = "0.4.20"
human-panic = "2.0.8"
image = { version = "0.25.10", default-features = false, features = [
    "color_quant",
    "jpeg",
    "png",
    "webp",
] }
num-format = "0.4.4"
owo-colors = "4.4.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.55", features = ["formatting"] }
time-humanize = { version = "0.1.3", features = ["time"] }
tokei = "15.0.0"
toml = "1.1.6"

[dev-dependencies]
criterion = "0.8.2"
gix-testtools = "0.21.0"
insta = { version = "1.49.0", features = ["json", "redactions"] }
rstest = "0.27.0"

[[bench]]
name = "repo"
harness = false

[build-dependencies]
lazy_static = "1.5.1"
regex = "1.13.1"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tera = { version = "2.4.0", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"

[target.'cfg(not(windows))'.dependencies]
base64 = "0.23.1"
color_quant = "1.1.0"
rustix = { version = "1.1.5", features = ["termios", "event"] }

[features]
fail-on-deprecated = []

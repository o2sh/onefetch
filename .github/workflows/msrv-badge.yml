name: MSRV
on:
  workflow_dispatch:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-msrv

      - name: Find MSRV
        run: cargo msrv find --min 1.85
